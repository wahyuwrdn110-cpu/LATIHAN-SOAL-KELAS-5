app.className="ent";app.innerHTML='<div class="narrow"><div class="hero"><div class="badge">🏫 SD Negeri Pengkol · Kelas 5</div><div class="sym"><i>⭐</i><i>⛓️</i><i>🌳</i><i>🐃</i><i>🌾</i></div><h1>Petualangan Pancasila</h1><p>Jelajahi 5 dunia dan taklukkan 25 misi! 🇮🇩</p></div><div class="card"><h3 style="margin:0">🎮 Siapkan Pemain</h3><label for="nm">Nama Lengkap</label><input id="nm" type="text" autocomplete="off" placeholder="Contoh: Budi Santoso" value="'+esc(S.n)+'"><label for="ab">No. Absen</label><input id="ab" type="number" inputmode="numeric" min="1" max="60" placeholder="Contoh: 12" value="'+esc(S.a)+'"><label>Pilih Karakter</label><div class="avs">'+av+'</div><div class="er" id="er"></div><h3 style="margin:0">📜 Aturan Main</h3><ul class="info"><li>25 misi pilihan ganda di 5 dunia.</li><li>Pilih jawaban paling tepat, boleh pindah misi lewat peta.</li><li>Kumpulkan lencana setiap 5 misi terjawab.</li><li>Tiap misi bernilai 4 poin (maksimal 100).</li></ul><button class="btn big" onclick="begin()">Mulai Petualangan ▶</button></div></div>'}
function begin(){var n=document.getElementById("nm").value.trim(),a=document.getElementById("ab").value.trim();if(!n||!a){document.getElementById("er").textContent="Isi nama dan no. absen dulu ya 😊";return}S.n=n;S.a=a;tone(660);leave(function(){draw(1)})}
function draw(d){if(fin)return;var q=Q[cur],w=Math.floor(cur/5),Wd=W[w],done=A.filter(function(x){return x>=0}).length,pc=done/Q.length*100,an=d?(d<0?"inL":"inR")+" an":"";
root.style.setProperty("--ac",Wd[2]);
var h='<div class="hud"><div class="av">'+S.av+'</div><div class="hi"><b>'+esc(S.n)+'</b><small>No. '+esc(S.a)+' · SDN Pengkol · Kelas 5</small></div><span class="coin">⭐ '+done+'</span><button class="snd" id="sn" onclick="mute()" aria-label="Suara">'+(snd?"🔊":"🔇")+'</button></div><div class="lay"><div><div class="world"><span class="we">'+Wd[0]+'</span><div><small>Dunia '+(w+1)+' dari 5</small><b>'+Wd[1]+'</b></div><span class="mi">Misi '+(cur+1)+'/25</span></div><div class="bar"><i style="--f:'+pw+'%;--t:'+pc+'%;width:'+pc+'%"></i></div><div class="card qc '+an+'" id="qc"><span class="qn">Misi '+(cur+1)+'</span><p class="q">'+q[0]+'</p>';
q[1].forEach(function(o,i){h+='<button class="opt'+(A[cur]==i?' on':'')+'" style="--i:'+i+'" onclick="pick('+i+',event)"><b class="c'+i+'">'+L[i]+'</b><span>'+o+'</span></button>'});
h+='<div class="nav"><button class="btn ghost" onclick="go(-1)"'+(cur==0?' disabled':'')+'>← Kembali</button>';
h+=cur==Q.length-1?'<button class="btn" onclick="finish()">Selesai ✓</button>':'<button class="btn" onclick="go(1)">Lanjut →</button>';
h+='</div></div></div><div class="card side"><b style="font-family:Fredoka,sans-serif">🗺️ Peta Petualangan</b>';
for(var k=0;k<5;k++){h+='<div class="wr"><span class="wl">'+W[k][0]+'</span><div class="nodes">';for(var j=k*5;j<k*5+5;j++)h+='<button style="--c:'+W[k][2]+'" class="'+(A[j]>=0?'done ':'')+(j==cur?'cur':'')+'" onclick="jump('+j+')">'+(j+1)+'</button>';h+='</div></div>'}
h+='<div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="finish()">Akhiri &amp; Lihat Nilai</button></div></div></div>';
app.className="";app.innerHTML=h;pw=pc;if(d)window.scrollTo({top:0,behavior:"smooth"})}
function swap(d,fn){var c=document.getElementById("qc");if(!c){fn();draw(d);return}c.classList.add(d>0?"outL":"outR");setTimeout(function(){fn();draw(d)},210)}
function pick(i,e){var was=A[cur];A[cur]=i;draw(0);sparkle(e);tone(520+i*90);if(was<0){var n=A.filter(function(x){return x>=0}).length;if(BD[n]&&!got[n]){got[n]=1;toast(BD[n]);setTimeout(function(){tone(880)},150)}}}
function go(d){swap(d,function(){cur+=d})}
function jump(i){if(i==cur)return;var d=i>cur?1:-1;swap(d,function(){cur=i})}
function count(n){var t0=null,el=document.getElementById("rn"),nv=document.getElementById("nv");function f(t){if(!t0)t0=t;var k=Math.min((t-t0)/1600,1),v=Math.round(n*(1-Math.pow(1-k,3)));el.style.setProperty("--p",v);nv.textContent=v;if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function confetti(){var E=["🎉","⭐","🌟","🎊","🇮🇩","🌾"],b=document.createElement("div");b.className="cf";for(var i=0;i<38;i++){var s=document.createElement("span");s.textContent=E[i%E.length];s.style.cssText="left:"+Math.random()*100+"%;animation-duration:"+(2.5+Math.random()*3)+"s;animation-delay:"+Math.random()*1.5+"s;font-size:"+(18+Math.random()*18)+"px";b.appendChild(s)}document.body.appendChild(b);setTimeout(function(){b.remove()},7500)}
function finish(){var un=A.filter(function(x){return x<0}).length;
if(un&&!confirm("Masih ada "+un+" misi belum dijawab. Yakin ingin menyelesaikan?"))return;
fin=true;var ok=0;Q.forEach(function(q,i){if(A[i]==q[2])ok++});
var n=ok*4,st=n>=85?3:n>=70?2:n>=56?1:0,em=["💪","😊","🥳","🏆"][st],rk=["Calon Pahlawan","Petualang Berani","Penjelajah Hebat","Pahlawan Pancasila"][st],msg=["Jangan menyerah! Ayo belajar lagi dan coba kembali!","Cukup baik. Yuk pelajari materinya lagi!","Bagus! Terus semangat belajar ya!","Luar biasa! Kamu hebat sekali!"][st];
root.style.setProperty("--ac",W[st==3?0:st==2?3:st==1?2:1][2]);
leave(function(){
var h='<div class="card score"><div class="mascot">'+em+'</div><div style="font-weight:800;font-size:1.25rem">'+esc(S.n)+'</div><div style="color:var(--mu)">No. Absen '+esc(S.a)+' · SD Negeri Pengkol · Kelas 5</div><div class="n" id="rn" style="--p:0"><span id="nv">0</span></div><div class="rank">'+rk+'</div><div class="stars">';
for(var i=0;i<3;i++)h+='<i class="'+(i<st?"lit":"")+'" style="--d:'+(1.2+i*.35)+'s">⭐</i>';
h+='</div><p style="font-weight:800;margin:4px 0">'+msg+'</p><div class="stats"><span style="color:var(--ok)">✅ Benar: '+ok+'</span><span style="color:var(--no)">❌ Salah: '+(Q.length-ok-un)+'</span><span>⚪ Kosong: '+un+'</span></div><button class="btn" onclick="start()">🔄 Main Lagi</button></div><div class="card" style="margin-top:14px"><h3 style="margin-top:0">📖 Pembahasan Jawaban</h3>';
Q.forEach(function(q,i){h+='<div class="rv"><h4>'+(i+1)+'. '+q[0]+'</h4>';
q[1].forEach(function(o,j){var c=j==q[2]?" ok":(A[i]==j?" no":"");h+='<div class="opt'+c+'"><b class="c'+j+'">'+L[j]+'</b><span>'+o+'</span></div>'});
h+='<small>'+(A[i]<0?"Tidak dijawab":A[i]==q[2]?"Jawabanmu benar ✓":"Jawabanmu salah ✗ · Jawaban benar: "+L[q[2]])+'</small></div>'});
app.className="ent";app.innerHTML=h+'</div>';window.scrollTo(0,0);count(n);tone(784);if(n>=56)confetti()})}
start();
</script>
